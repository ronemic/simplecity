name: Set up Playwright Chromium
description: Cache Chromium, tolerate transient package mirrors, and verify a real browser launch

runs:
  using: composite
  steps:
    - name: Restore Playwright browser cache
      id: playwright-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: node_modules/playwright-core/.local-browsers
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium system dependencies
      shell: bash
      run: |
        set -euo pipefail
        dependencies_installed=false
        for attempt in 1 2 3; do
          if timeout 5m npx playwright install-deps chromium; then
            dependencies_installed=true
            break
          fi
          echo "::warning::Playwright dependency installation attempt ${attempt} failed."
          sleep $((attempt * 10))
        done
        if [ "$dependencies_installed" != "true" ]; then
          echo "::warning::Dependency installation was unavailable; continuing because the runner may already contain Chromium libraries. The launch check will remain authoritative."
        fi

    - name: Install and verify Chromium browser
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: "0"
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if timeout 8m npx playwright install chromium; then
            if timeout 45s node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ headless: true }); await browser.close();'; then
              echo "Chromium installation and launch check succeeded."
              exit 0
            fi
            echo "::warning::Chromium launch check failed on attempt ${attempt}."
          else
            echo "::warning::Chromium browser installation attempt ${attempt} failed."
          fi

          # A failed launch can mean the runner image changed underneath a valid
          # browser cache. Retry system dependencies before the next launch.
          timeout 5m npx playwright install-deps chromium || true
          sleep $((attempt * 10))
        done
        echo "::error::Chromium could not be installed and launched after three attempts."
        exit 1
