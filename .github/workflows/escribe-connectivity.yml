name: eSCRIBE connectivity probe
on:
  push:
    branches: [codex/escribe-connectivity]
permissions:
  contents: read
jobs:
  documents:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fetch official PDFs with full Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          cat > /tmp/escribe-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: false });
          const context = await browser.newContext();
          const page = await context.newPage();
          const base = 'https://pub-santamaria.escribemeetings.com/';
          try {
            await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const docs = await import(process.cwd() + '/lib/scraper/browserDocumentFetch.ts');
            const fetcher = docs.createBrowserDocumentFetch(page, base, console.log);
            for (const id of [15193, 15350]) {
              const response = await fetcher(base + 'FileStream.ashx?DocumentId=' + id);
              const bytes = Buffer.from(await response.arrayBuffer());
              console.log(id, response.status, 'bytes', bytes.length, 'prefix', bytes.subarray(0, 5).toString());
              if (response.status !== 200 || bytes.subarray(0,5).toString() !== '%PDF-') throw new Error('No PDF');
            }
          } finally {
            await browser.close();
          }
          JS
          cp /tmp/escribe-probe.mjs ./escribe-probe.mjs
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node --import tsx/esm escribe-probe.mjs
          else
            node --import tsx/esm escribe-probe.mjs
          fi
