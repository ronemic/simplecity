name: Menlo Park Pipeline

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:

env:
  CI: true
  NEXT_PUBLIC_APP_URL: https://simplecity.app
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
  GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
  GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
  GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
  GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
  NEXT_PUBLIC_MENLO_PARK_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_MENLO_PARK_SUPABASE_URL }}
  NEXT_PUBLIC_MENLO_PARK_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_MENLO_PARK_SUPABASE_ANON_KEY }}
  MENLO_PARK_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MENLO_PARK_SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SOUTH_SAN_MATEO_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SOUTH_SAN_MATEO_SUPABASE_URL }}
  NEXT_PUBLIC_SOUTH_SAN_MATEO_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SOUTH_SAN_MATEO_SUPABASE_ANON_KEY }}
  SOUTH_SAN_MATEO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOUTH_SAN_MATEO_SUPABASE_SERVICE_ROLE_KEY }}
  MENLO_PARK_AGENDAS_URL: https://www.menlopark.gov/Agendas-and-minutes

permissions:
  contents: read

jobs:
  menlo-park:
    name: Menlo Park pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: menlo-park-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        uses: ./.github/actions/setup-playwright

      - name: Run Menlo Park pipeline
        run: npm run pipeline:menlo-park -- --months-back=$([ "$(date -u +%u)" = "1" ] && echo 3 || echo 1) --max-runtime-minutes=75 --require-results-coverage
