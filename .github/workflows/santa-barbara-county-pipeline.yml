name: Santa Barbara County Pipeline

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

env:
  CI: true
  NEXT_PUBLIC_APP_URL: https://simplecity.app
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openai/gpt-oss-120b:free' }}
  OPENROUTER_FALLBACK_API_KEY: ${{ secrets.OPENROUTER_FALLBACK_API_KEY }}
  OPENROUTER_FALLBACK_MODEL: ${{ secrets.OPENROUTER_FALLBACK_MODEL }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
  CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
  CEREBRAS_TOKENS_PER_MINUTE: ${{ vars.CEREBRAS_TOKENS_PER_MINUTE || '60000' }}
  NEXT_PUBLIC_SANTA_BARBARA_REGION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SANTA_BARBARA_REGION_SUPABASE_URL }}
  NEXT_PUBLIC_SANTA_BARBARA_REGION_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SANTA_BARBARA_REGION_SUPABASE_ANON_KEY }}
  SANTA_BARBARA_REGION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANTA_BARBARA_REGION_SUPABASE_SERVICE_ROLE_KEY }}
  SANTA_BARBARA_COUNTY_LEGISTAR_URL: https://santabarbara.legistar.com/Calendar.aspx

permissions:
  contents: read

jobs:
  santa-barbara-county:
    name: Santa Barbara County pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: santa-barbara-county-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Santa Barbara County pipeline
        run: npm run pipeline:santa-barbara-county -- --months-back=$([ "$(date -u +%u)" = "1" ] && echo 3 || echo 1) --max-runtime-minutes=75 --require-results-coverage
