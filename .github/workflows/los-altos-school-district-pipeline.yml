name: Los Altos School District Pipeline

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      months_back:
        description: "Meeting lookback window"
        required: true
        default: automatic
        type: choice
        options:
          - automatic
          - "1"
          - "3"

env:
  CI: true
  NEXT_PUBLIC_APP_URL: https://simplecity.app
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
  GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
  GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
  GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
  GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
  NEXT_PUBLIC_SANTA_CLARA_REGION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SANTA_CLARA_REGION_SUPABASE_URL }}
  NEXT_PUBLIC_SANTA_CLARA_REGION_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SANTA_CLARA_REGION_SUPABASE_ANON_KEY }}
  SANTA_CLARA_REGION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANTA_CLARA_REGION_SUPABASE_SERVICE_ROLE_KEY }}
  LOS_ALTOS_SCHOOL_DISTRICT_SIMBLI_URL: https://simbli.eboardsolutions.com/SB_Meetings/SB_MeetingListing.aspx?S=36030305

permissions:
  contents: read

jobs:
  los-altos-school-district:
    name: Los Altos School District pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: los-altos-school-district-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        uses: ./.github/actions/setup-playwright

      - name: Select meeting lookback
        id: lookback
        env:
          REQUESTED_MONTHS_BACK: ${{ inputs.months_back || 'automatic' }}
        run: |
          if [ "$REQUESTED_MONTHS_BACK" = "automatic" ]; then
            if [ "$(date -u +%u)" = "1" ]; then
              months_back=3
            else
              months_back=1
            fi
          else
            months_back="$REQUESTED_MONTHS_BACK"
          fi
          echo "months_back=$months_back" >> "$GITHUB_OUTPUT"

      - name: Run Los Altos School District Board pipeline
        run: npm run pipeline:los-altos-school-district -- --months-back=${{ steps.lookback.outputs.months_back }} --max-runtime-minutes=45 --require-results-coverage
